name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [strapi-content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: |
          node scripts/check-production-env.mjs
          npm run build
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL || 'https://strapi.northlinestudio.io' }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          STRAPI_API_VERSION: ${{ vars.STRAPI_API_VERSION || '5' }}
          STRAPI_ARTICLES_PATH: ${{ vars.STRAPI_ARTICLES_PATH || '/api/articles' }}
          STRAPI_LOCALE: ${{ vars.STRAPI_LOCALE }}
          SITE_URL: ${{ vars.SITE_URL || 'https://beamerboi.github.io' }}

      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
